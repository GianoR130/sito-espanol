    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <style>
        body {
            overflow: hidden;
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 0;
            background-image: url('https://newsroom.porsche.com/.imaging/mte/porsche-templating-theme/image_1290x726/dam/pnr/2023/Motorsports/FIA-WEC/Sebring-USA/Race/M23_1234_fine.jpg/jcr:content/M23_1234_fine.jpg'); 
            background-size: cover;
            background-repeat: no-repeat;
            background-position: center center;
            height: 100vh;
        }
        ul {
            display: grid;
            grid-template-columns: repeat(3, 1fr); 
            gap: 35px; 
            padding: 0;
            padding-top: 120px; 
            padding-left: 20px;
            padding-right: 20px;
        }
        li {
            background: rgba(255, 255, 255, 0.8); 
            padding: 20px;
            border-radius: 15px; 
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 18px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s ease; /* Aggiungi transizione per l'effetto */
        }

        li:hover {
            transform: scale(1.1); /* Ingrandisce l'elemento quando il mouse ci passa sopra */
        }

        .titolo {
            padding: 1rem 0;
            text-align: center;
        }

        header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            z-index: 1000;
            background-color: white;
            color: black;
            padding: 2rem 0;
            outline: 3px solid black; 
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1); 
        }

        .bottoni-container {
            margin-top: 50px; 
        }
    </style>
</head>
